name: Deploy VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # FRONTEND
      - name: Install Frontend
        working-directory: ./projects
        run: npm install

      - name: Build Frontend
        working-directory: ./projects
        run: npm run build

      # BACKEND
      - name: Install Backend
        working-directory: ./projects-back
        run: npm install

      # COPY FRONTEND
      - name: Upload Frontend
        uses: appleboy/scp-action@master
        with:
          host: 185.193.17.217
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "projects/dist/*"
          target: "/var/www/projects-front"

      # COPY BACKEND
      - name: Upload Backend
        uses: appleboy/scp-action@master
        with:
          host: 185.193.17.217
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "projects-back/*"
          target: "/var/www/projects-back"

      # RESTART BACKEND
      - name: Restart Backend
        uses: appleboy/ssh-action@master
        with:
          host: 185.193.17.217
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/projects-back/projects-back

            npm install

            pm2 restart projects-back || pm2 start index.js --name projects-back

            systemctl restart nginx
