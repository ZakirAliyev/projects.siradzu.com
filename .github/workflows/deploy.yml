name: Deploy VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # FRONTEND
      - name: Install Frontend
        working-directory: ./projects
        run: npm install

      - name: Build Frontend
        working-directory: ./projects
        run: npm run build

      # BACKEND
      - name: Install Backend
        working-directory: ./projects-back
        run: npm install

      # COPY FRONTEND
      - name: Upload Frontend
        uses: appleboy/scp-action@master
        with:
          host: 185.193.17.217
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "projects/dist/*"
          target: "/var/www/projects-front"

      # COPY BACKEND
      - name: Upload Backend
        uses: appleboy/scp-action@master
        with:
          host: 185.193.17.217
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "projects-back/*"
          target: "/var/www/projects-back"

      # RESTART BACKEND
      - name: Restart Backend
        uses: appleboy/ssh-action@master
        with:
          host: 185.193.17.217
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/projects-back/projects-back

            npm install

            pm2 restart projects-back || pm2 start index.js --name projects-back

            systemctl restart nginx

            mkdir -p /var/www/projects-front/projects/dist
            mkdir -p /var/www/projects-front

            {
              echo "=== DATE ==="
              date
              echo "=== PM2 STATUS ==="
              pm2 status
              echo "=== PM2 SHOW ==="
              pm2 show projects-back || true
              echo "=== PM2 LOGS ==="
              pm2 logs projects-back --lines 100 --err --out --raw --nostream || true
              echo "=== LOCAL CURL PROJECTS ==="
              curl -i http://localhost:5001/api/projects || true
              echo "=== LOCAL CURL LOGIN ==="
              curl -i -X POST -H "Content-Type: application/json" -d '{"email":"admin@texnocode.com","password":"Admin123!"}' http://localhost:5001/api/login || true
              echo "=== NGINX CONFIG ==="
              cat /etc/nginx/sites-enabled/* || true
            } > /var/www/projects-front/nginx-debug.txt

            cp /var/www/projects-front/nginx-debug.txt /var/www/projects-front/projects/dist/nginx-debug.txt || true

